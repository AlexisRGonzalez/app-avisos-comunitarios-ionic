<ion-header [translucent]="true">
  <ion-toolbar color="primary">
    <ion-title>Publicaciones</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <ion-list>
    <ion-item *ngFor="let aviso of publicaciones">
      <ion-thumbnail slot="start">
        <img [src]="aviso.foto || 'assets/icon/favicon.png'" />
      </ion-thumbnail>
      <ion-label>
        <h2>{{ aviso.titulo }}</h2>
        <p>{{ aviso.descripcion }}</p>
        <ion-note>{{ aviso.fecha | date:'dd/MM/yyyy' }}</ion-note>
      </ion-label>
      <ion-button fill="clear" color="danger" (click)="confirmarEliminacion(aviso)">
        <ion-icon name="trash-outline" slot="icon-only"></ion-icon>
      </ion-button>
    </ion-item>
  </ion-list>

  <ion-fab vertical="bottom" horizontal="end" slot="fixed">
    <ion-fab-button routerLink="/registro">
      <ion-icon name="add"></ion-icon>
    </ion-fab-button>
  </ion-fab>
</ion-content>
